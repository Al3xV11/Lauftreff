name: Fetch OpenWeather Data

# Workflow wird bei jedem Push auf main oder manuell ausgelöst
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fetch-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch OpenWeather Data
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
        run: |
          echo "📡 Hol Wetterdaten..."
          LAT=49.2478
          LON=7.3666
          DATA=$(curl -s "https://api.openweathermap.org/data/2.5/forecast?lat=$LAT&lon=$LON&units=metric&lang=de&appid=$OPENWEATHER_KEY")
          mkdir -p data
          echo "$DATA" > data/weather.json
          echo "✅ Wetterdaten gespeichert in data/weather.json"

      - name: Commit weather.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/weather.json
          git commit -m "Update weather.json" || echo "Keine Änderungen"
          git push
