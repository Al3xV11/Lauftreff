<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mittwoch Umfrage</title>

<style>
body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 12px; }
h2 { font-size: 1.3em; text-align: center; }
h3 { margin-top: 24px; }
input { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px; font-size: 18px; margin: 6px 0; border-radius: 8px; border: none; background: #1565c0; color: white; cursor: pointer; }
button:active { background: #0d47a1; }
#weather { text-align: center; font-size: 1.1em; margin-bottom: 16px; cursor: pointer; text-decoration: underline; }
ul { padding-left: 0; }
li { list-style: none; padding: 6px 0; line-height: 1.4; font-size: 16px; }
.count { display: inline-block; background-color: #1b5e20; color: white; border-radius: 50%; width: 28px; height: 28px; text-align: center; line-height: 28px; font-weight: bold; font-size: 16px; }
.divider { width: 100%; border-top: 2px solid #aaa; margin: 12px 0; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
.modal-content { background: white; color: black; margin: 12% auto; padding: 20px; width: 90%; max-width: 400px; border-radius: 12px; }
.close { float: right; font-size: 24px; cursor: pointer; }
</style>
</head>

<body>

<h2>📍 Zweibrücken<br>🕓 Mittwoch, 16–18 Uhr</h2>
<p id="weather">Wetter wird geladen…</p>
<div class="divider"></div>

<!-- Wetter Modal -->
<div id="weatherModal" class="modal">
  <div class="modal-content">
    <span id="closeBtn" class="close">×</span>
    <h3>🌦️ Wetter Mittwoch 16–18 Uhr</h3>
    <div id="weatherDetails">Lade Details…</div>
  </div>
</div>

<h3>So Leute, wer ist am Start?</h3>
<input id="name" placeholder="Dein Name">

<button id="btn-all">Laufen & Essen 🏃🏃‍♀️🍻 <span class="count">0</span></button>
<button id="btn-run">Nur Laufen 🏃🏃‍♀️ <span class="count">0</span></button>
<button id="btn-eat">Nur Essen 🍻 <span class="count">0</span></button>
<button id="btn-out">Ganz raus 🛁 <span class="count">0</span></button>

<h3>👇 Aktuelle Stimmen</h3>
<ul id="results"></ul>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";

/* 🔑 Firebase CONFIG – WICHTIG: appId ist Pflicht für App Check */
const firebaseConfig = {
  apiKey: "AIzaSyDfx5EL5raG8vDcaEAGFiIfQU1tLyMl7uk",
  authDomain: "lauftreff-ad4df.firebaseapp.com",
  projectId: "lauftreff-ad4df",
  storageBucket: "lauftreff-ad4df.firebasestorage.app",
  messagingSenderId: "693199438592",
  appId: "1:693199438592:web:32ec3ca5b0a932cd90a9e5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔒 App Check */
initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider("DEIN_RECAPTCHA_SITE_KEY"),
  isTokenAutoRefreshEnabled: true
});

/* Name merken */
const nameInput = document.getElementById("name");
const savedName = localStorage.getItem("userName");
if (savedName) nameInput.value = savedName;

/* Modal Logik */
const weatherModal = document.getElementById("weatherModal");
document.getElementById("closeBtn").onclick = () => weatherModal.style.display = "none";
weatherModal.onclick = e => { if (e.target === weatherModal) weatherModal.style.display = "none"; };
document.getElementById("weather").onclick = () => weatherModal.style.display = "block";

/* Voting */
function vote(choice) {
  const name = nameInput.value.trim();
  if (!name) return alert("Bitte Namen eingeben");
  localStorage.setItem("userName", name);
  setDoc(doc(db, "votes", name), {
    choice,
    time: new Date()
  });
}

document.getElementById("btn-all").onclick = () => vote("Laufen & Essen");
document.getElementById("btn-run").onclick = () => vote("Nur Laufen");
document.getElementById("btn-eat").onclick = () => vote("Nur Essen");
document.getElementById("btn-out").onclick = () => vote("Ganz raus");

/* Live Ergebnisse */
onSnapshot(collection(db, "votes"), snap => {
  const results = document.getElementById("results");
  results.innerHTML = "";
  const counts = {
    "Laufen & Essen": [],
    "Nur Laufen": [],
    "Nur Essen": [],
    "Ganz raus": []
  };

  snap.forEach(d => counts[d.data().choice]?.push(d.id));

  document.querySelector("#btn-all .count").textContent = counts["Laufen & Essen"].length;
  document.querySelector("#btn-run .count").textContent = counts["Nur Laufen"].length;
  document.querySelector("#btn-eat .count").textContent = counts["Nur Essen"].length;
  document.querySelector("#btn-out .count").textContent = counts["Ganz raus"].length;

  for (const [choice, names] of Object.entries(counts)) {
    if (names.length) {
      results.innerHTML += `<li><strong>${choice}:</strong> ${names.join(", ")}</li>`;
    }
  }
});

/* 🌦️ Wetter */
async function loadWeather() {
  const key = "DEIN_OPENWEATHER_KEY";
  const lat = 49.2478, lon = 7.3666;

  const r = await fetch(
    `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=de&appid=${key}`
  );
  const data = await r.json();

  document.getElementById("weather").innerText =
    `🌦️ ${data.list[0].main.temp.toFixed(1)} °C – ${data.list[0].weather[0].description}`;
}

loadWeather();
</script>

</body>
</html>
