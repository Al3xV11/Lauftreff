<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firmenlauf Ergebnisse</title>
<link rel="icon" href="app_icon.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
<script src="menu.js"></script>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <div id="menu" class="menu">
    <a href="index.html">🏠 Abstimmung</a>
    <a href="pace.html">🏃 Pace Rechner</a>
    <a href="firmenlauf.html">🏃 Anmeldung Firmenlauf</a>
    <a href="result.html">🏁 Firmenlauf Ergebnisse</a>
  </div>
</div>

<h1>🏁 Firmenlauf Ergebnisse</h1>

<div id="status">lädt...</div>

<div class="stats">

<div class="card">
<h3>🥇 Schnellster Läufer</h3>
<div id="fastest">–</div>
</div>

<div class="card">
<h3>🏁 Finisher</h3>
<div id="finishers">0</div>
</div>

<div class="card">
<h3>👟 Teilnehmer</h3>
<div id="participants">0</div>
</div>

</div>


<h2>🏆 Teamwertung</h2>

<table>
<thead>
<tr>
<th>Rang</th>
<th>Team</th>
<th>Zeit (Top 3)</th>
</tr>
</thead>
<tbody id="teamBody"></tbody>
</table>


<h2>👟 Läufer</h2>

<table>
<thead>
<tr>
<th>Platz</th>
<th>Name</th>
<th>Team</th>
<th>Zeit</th>
</tr>
</thead>
<tbody id="runnerBody"></tbody>
</table>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDTk0mMhZ6eX1jzZuFIYEoHY38YZUcEpns",
  authDomain: "firmenlauf-8e694.firebaseapp.com",
  projectId: "firmenlauf-8e694",
  storageBucket: "firmenlauf-8e694.firebasestorage.app",
  messagingSenderId: "740730808511",
  appId: "1:740730808511:web:11a5d055eb10790a453e0a"
};

const app = initializeApp(firebaseConfig);
initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider("6LdZpnYsAAAAANqU6pXftGa3Sq_TtVM6aOoIKYsG"),
  isTokenAutoRefreshEnabled: true
});
const db = getFirestore(app);

/* 🔹 Hilfsfunktionen */
function parseTime(t){ if(!t) return null; const [m,s]=t.split(":").map(Number); return m*60+s; }
function formatTime(sec){ const m=Math.floor(sec/60); const s=sec%60; return `${m}:${s.toString().padStart(2,"0")}`; }

/* 🔹 Lade alle Teams aus Firebase */
async function getTeams(){
  const snap = await getDocs(collection(db,"teams"));
  return snap.docs.map(d=>d.id.toLowerCase());
}

/* 🔹 Lade RaceResult Ergebnisse via HTML Scraping */
async function loadResults(){
  try{
    const myTeams = await getTeams(); // Teams aus Firebase
const res = await fetch("https://my2.raceresult.com/313865/results/list?key=f6af37caa90f96b71a1ebe530e66f614&listname=RaceResult Timing BW gmbh|Zieleinlauf-Liste&page=results&contest=0&r=leaders&l=10000&openedGroups={}&term=");

const json = await res.json();

const results = json.data.map(r => ({
  rank: r[2],
  name: r[3],
  team: r[4],
  time: r[7]
}));
    }).filter(r=>r.rank && r.team); // leere Zeilen raus

    // Filter nach deinen Teams
    const filtered = results.filter(r => myTeams.some(t => r.team.toLowerCase().includes(t)));
    renderRunners(filtered);
    renderTeamRanking(filtered);
    renderStats(filtered);
    document.getElementById("status").innerText = "Aktualisiert "+new Date().toLocaleTimeString();
  } catch(e){
    console.error(e);
    document.getElementById("status").innerText = "Fehler beim Laden der Ergebnisse";
  }
}

/* 🔹 Render Läufer */
function renderRunners(data){
  const tbody = document.getElementById("runnerBody");
  tbody.innerHTML="";
  data.forEach(p=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${p.rank}</td><td>${p.name}</td><td>${p.team}</td><td>${p.time}</td>`;
    tbody.appendChild(tr);
  });
}

/* 🔹 Render Stats */
function renderStats(data){
  const finishers = data.filter(p=>p.time).length;
  document.getElementById("finishers").innerText = finishers;
  document.getElementById("participants").innerText = data.length;

  const fastest = data.filter(p=>p.time).sort((a,b)=>parseTime(a.time)-parseTime(b.time))[0];
  if(fastest) document.getElementById("fastest").innerText = `${fastest.name} (${fastest.time})`;
}

/* 🔹 Teamwertung (Top3 Zeiten) */
function renderTeamRanking(data){
  const teams = {};
  data.forEach(p=>{
    if(!p.time) return;
    if(!teams[p.team]) teams[p.team] = [];
    teams[p.team].push(parseTime(p.time));
  });

  const ranking = [];
  for(const team in teams){
    const t = teams[team].sort((a,b)=>a-b).slice(0,3);
    if(t.length===3){
      ranking.push({team, time: t.reduce((a,b)=>a+b,0)});
    }
  }
  ranking.sort((a,b)=>a.time-b.time);

  const tbody = document.getElementById("teamBody");
  tbody.innerHTML="";
  ranking.forEach((r,i)=>{
    const tr = document.createElement("tr");
    if(i===0) tr.className="rank1";
    if(i===1) tr.className="rank2";
    if(i===2) tr.className="rank3";
    tr.innerHTML = `<td>${i+1}</td><td>${r.team}</td><td>${formatTime(r.time)}</td>`;
    tbody.appendChild(tr);
  });
}

/* 🔹 Erst laden + Live Refresh alle 30 Sekunden */
loadResults();
setInterval(loadResults, 30000);
</script>
</body>
</html>
