<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firmenlauf Ergebnisse</title>
<link rel="icon" href="app_icon.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
<script src="menu.js"></script>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <div id="menu" class="menu">
    <a href="index.html">🏠 Abstimmung</a>
    <a href="pace.html">🏃 Pace Rechner</a>
    <a href="firmenlauf.html">🏃 Anmeldung Firmenlauf</a>
    <a href="result.html">🏁 Firmenlauf Ergebnisse</a>
  </div>
</div>

<h1>🏁 Firmenlauf Ergebnisse</h1>

<div id="status">lädt...</div>

<div class="stats">

<div class="card">
<h3>🥇 Schnellster Läufer</h3>
<div id="fastest">–</div>
</div>

<div class="card">
<h3>🏁 Finisher</h3>
<div id="finishers">0</div>
</div>

<div class="card">
<h3>👟 Teilnehmer</h3>
<div id="participants">0</div>
</div>

</div>


<h2>🏆 Teamwertung</h2>

<table>
<thead>
<tr>
<th>Rang</th>
<th>Team</th>
<th>Zeit (Top 3)</th>
</tr>
</thead>
<tbody id="teamBody"></tbody>
</table>


<h2>👟 Läufer</h2>

<table>
<thead>
<tr>
<th>Platz</th>
<th>Name</th>
<th>Team</th>
<th>Zeit</th>
</tr>
</thead>
<tbody id="runnerBody"></tbody>
</table>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyDTk0mMhZ6eX1jzZuFIYEoHY38YZUcEpns",
authDomain: "firmenlauf-8e694.firebaseapp.com",
projectId: "firmenlauf-8e694",
storageBucket: "firmenlauf-8e694.firebasestorage.app",
messagingSenderId: "740730808511",
appId: "1:740730808511:web:11a5d055eb10790a453e0a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const EVENT_ID="313865";


function parseTime(t){

if(!t) return null;

const p=t.split(":").map(Number);

return p[0]*3600+p[1]*60+p[2];

}

function formatTime(sec){

const h=Math.floor(sec/3600);
const m=Math.floor((sec%3600)/60);
const s=sec%60;

return `${h}:${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;

}


async function getTeams(){

const snap=await getDocs(collection(db,"teams"));

const teams=[];

snap.forEach(doc=>{
teams.push(doc.id.toLowerCase());
});

return teams;

}



async function loadResults(){

try{

const teams=await getTeams();

const res=await fetch(`https://my.raceresult.com/${EVENT_ID}/data`);
const data=await res.json();


const filtered=data.filter(p=>
teams.some(t=>
(p.team||"").toLowerCase().includes(t)
)
);


renderRunners(filtered);

renderTeamRanking(filtered);

renderStats(filtered);


document.getElementById("status").innerText=
"Aktualisiert "+new Date().toLocaleTimeString();


}catch(e){

console.error(e);

}

}



function renderRunners(data){

const tbody=document.getElementById("runnerBody");
tbody.innerHTML="";

data.forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${p.rank||""}</td>
<td>${p.firstname||""} ${p.lastname||""}</td>
<td>${p.team||""}</td>
<td>${p.time||""}</td>
`;

tbody.appendChild(tr);

});

}



function renderStats(data){

const finishers=data.filter(p=>p.time).length;

document.getElementById("finishers").innerText=finishers;

document.getElementById("participants").innerText=data.length;


const fastest=data
.filter(p=>p.time)
.sort((a,b)=>parseTime(a.time)-parseTime(b.time))[0];

if(fastest){

document.getElementById("fastest").innerText=
`${fastest.firstname} ${fastest.lastname} (${fastest.time})`;

}

}



function renderTeamRanking(data){

const teams={};

data.forEach(p=>{

if(!p.time) return;

if(!teams[p.team]) teams[p.team]=[];

teams[p.team].push(parseTime(p.time));

});


const ranking=[];

for(const team in teams){

const t=teams[team].sort((a,b)=>a-b).slice(0,3);

if(t.length===3){

ranking.push({
team,
time:t[0]+t[1]+t[2]
});

}

}


ranking.sort((a,b)=>a.time-b.time);

const tbody=document.getElementById("teamBody");

tbody.innerHTML="";

ranking.forEach((r,i)=>{

const tr=document.createElement("tr");

if(i===0) tr.className="rank1";
if(i===1) tr.className="rank2";
if(i===2) tr.className="rank3";

tr.innerHTML=`
<td>${i+1}</td>
<td>${r.team}</td>
<td>${formatTime(r.time)}</td>
`;

tbody.appendChild(tr);

});

}



loadResults();

setInterval(loadResults,30000);

</script>

</body>
</html>
